name: Update NAR results

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nar-results.yml
      - scripts/update_nar_results.py
      - scripts/watch_nar_results.py
      - scripts/render_nar_results.py
      - scripts/render_day_prediction.py
      - data/results/targets.json
  workflow_dispatch:
  # Hourly recovery only. The running worker handles the two-minute updates.
  schedule:
    - cron: '7 5-13 8 10 *'

permissions:
  contents: write

concurrency:
  group: nar-results-main
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Keep official results current until the meeting is complete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -u scripts/watch_nar_results.py
